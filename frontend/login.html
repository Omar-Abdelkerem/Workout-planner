<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Planner - Login</title>
    <link rel="stylesheet" href="./dist/output.css">
</head>

<body class="bg-slate-200 text-slate-800 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="w-full max-w-md bg-slate-300 rounded-3xl p-8 shadow-sm">
        <!-- Logo Placeholder -->
        <div class="flex flex-col items-center mb-6">
            <div
                class="w-28 h-28 bg-slate-400 rounded-2xl flex items-center justify-center text-slate-700 font-bold text-xl mb-4">
                Logo
            </div>
            <h1 class="text-2xl font-bold text-slate-900">Fitness Planner</h1>
            <p class="text-slate-700 text-sm font-semibold mt-1">Welcome</p>
            <p class="text-slate-600 text-xs mt-1">Your workouts, organized. (slogan)</p>
        </div>

        <!-- Form -->
        <form action="dashboard.html" method="GET" class="space-y-4">
            <div>
                <input type="email" placeholder="Email"
                    class="w-full bg-slate-100 border-none rounded-xl px-4 py-3 text-sm text-slate-800 placeholder-slate-500 focus:outline-none">
            </div>
            <div>
                <input type="password" placeholder="Password"
                    class="w-full bg-slate-100 border-none rounded-xl px-4 py-3 text-sm text-slate-800 placeholder-slate-500 focus:outline-none">
                <div class="text-right mt-1">
                    <a href="#" class="text-xs text-slate-600 hover:underline">Forgot password?</a>
                </div>
            </div>
            <button type="submit"
                class="w-full bg-slate-400 hover:bg-slate-500 text-slate-900 font-bold py-3 rounded-xl text-sm transition-colors">
                Login
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-700">
            Don't have an account? <a href="register.html" class="font-bold underline text-slate-900">Sign up</a>
        </div>
    </div>

</body>

</html>
